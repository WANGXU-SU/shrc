# [已废弃 DEPRECATED] 此配置已停用，请改用 shrc-revised.conf：
# https://raw.githubusercontent.com/WANGXU-SU/shrc/refs/heads/main/shrc-revised.conf
#
# Shadowrocket 旧版配置（WANGXU-SU/shrc）
# GEOIP CN 直连，其余代理；Claude 优先强制代理；无 DIRECT 回退
# 严格隐私模式：拒绝应用 UDP，可能影响语音/视频通话及游戏
# YouTube 去广告需要安装并信任 MITM 证书

[General]
update-url = https://raw.githubusercontent.com/WANGXU-SU/shrc/refs/heads/main/shrc.conf
bypass-system = false
# 不再绕过苹果、银行或私网；仅保留本机回环
skip-proxy = localhost,127.0.0.1
tun-excluded-routes = 127.0.0.0/8

# 普通、直连及备用 DNS 均使用经代理的 DoH；IP 地址避免解析 DoH 主机的启动循环
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
direct-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 仅用于代理节点自身域名的启动解析；不能依赖尚未建立的代理
# 要消除这部分直连解析，应在节点中使用 IP 地址并保留 TLS SNI
proxy-dns-server = https://223.5.5.5/dns-query
dns-fallback-system = false
dns-direct-system = false
dns-direct-fallback-proxy = true
ipv6 = false
prefer-ipv6 = false
private-ip-answer = false
icmp-auto-reply = true
always-reject-url-rewrite = false
udp-policy-not-supported-behaviour = REJECT
hijack-dns = *:53
block-quic = all

[Proxy]

[Proxy Group]
# PROXY 使用首页选中的节点；不要选择“直连”，不要覆盖为全局直连模式
# 不自动轮换节点，便于 Claude 登录/API/下载保持相同出口
🚀 强制代理 = select,PROXY,REJECT,policy-select-name=PROXY
🧠 Claude Code = select,PROXY,REJECT,policy-select-name=PROXY

[Rule]
# 隐私阻断先于所有直连规则。DNS 53 查询应由 hijack-dns 在本地接管。
# PROTOCOL 置于逻辑规则内；覆盖任意端口的 IPv4 应用 UDP。
AND,((PROTOCOL,UDP),(IP-CIDR,0.0.0.0/0)),REJECT
IP-CIDR6,::/0,REJECT,no-resolve
# 补充拒绝 TCP 明文 DNS、DoT 及常见 STUN/TURN 端口
DST-PORT,53,REJECT
DST-PORT,853,REJECT
DST-PORT,3478,REJECT
DST-PORT,5349,REJECT
DOMAIN-KEYWORD,stun.,REJECT
DOMAIN-KEYWORD,turn.,REJECT

# Claude 官方域名及安装/更新/插件依赖优先代理，不受 GEOIP CN 影响
DOMAIN-SUFFIX,anthropic.com,🧠 Claude Code
DOMAIN-SUFFIX,claude.ai,🧠 Claude Code
DOMAIN-SUFFIX,claude.com,🧠 Claude Code
DOMAIN-SUFFIX,claudeusercontent.com,🧠 Claude Code
DOMAIN-SUFFIX,claudemcpcontent.com,🧠 Claude Code
DOMAIN-SUFFIX,storage.googleapis.com,🧠 Claude Code
DOMAIN-SUFFIX,npmjs.org,🧠 Claude Code
DOMAIN-SUFFIX,github.com,🧠 Claude Code
DOMAIN-SUFFIX,githubusercontent.com,🧠 Claude Code
DOMAIN-SUFFIX,githubassets.com,🧠 Claude Code
DOMAIN-SUFFIX,datadoghq.com,🧠 Claude Code
DOMAIN-SUFFIX,browser-intake-us5-datadoghq.com,🧠 Claude Code
DOMAIN-SUFFIX,formulae.brew.sh,🧠 Claude Code

# 主/备用 DoH 必须代理；节点启动 DoH 为唯一外部直连 DNS 例外
IP-CIDR,1.1.1.1/32,🚀 强制代理,no-resolve
IP-CIDR,8.8.8.8/32,🚀 强制代理,no-resolve
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BlockHttpDNS/BlockHttpDNS.list,REJECT

# 仅回环直连；不使用 China 域名列表/银行/苹果等额外直连白名单
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,🚀 强制代理

[Host]
localhost = 127.0.0.1
localhost.weixin.qq.com = 127.0.0.1

[URL Rewrite]
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

# YouTube 去广告辅助重写
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200

[Script]
# YouTube Enhance / 去广告
# 脚本来源：Maasea/sgmodule
youtube.response = type=http-response,pattern=^https:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config)(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument="{\"captionLang\":\"off\",\"blockUpload\":false,\"blockImmersive\":false,\"blockShorts\":false,\"debug\":false}"

youtube.request.init = type=http-request,pattern=^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js

youtube.request.log_event = type=http-request,pattern=^https:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/log_event,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js

[MITM]
# 只解密 YouTube 去广告需要的主机，避免扩大 MITM 范围
hostname = %APPEND% -redirector*.googlevideo.com,*.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com,youtubei-att.googleapis.com,*.google.cn
enable = true
