# 大陆域名与网段：.cn 顶级域 + DOMAIN-SET（纯域名表）+ RULE-SET（补充关键字与大陆 IP 段）配合，
# 命中即 DIRECT，并使用国内 direct-dns-server 解析；GEOIP 在后面做最终兜底。
DOMAIN-SUFFIX,cn,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT

# —— 第 3 层：IP 兜底 ——
# 回环与私网段直连（私网流量不进代理，也不被拒绝，开着 VPN 也能访问内网）；
# 前面都没命中的国内 IP 走 GEOIP 兜底；其余全部强制代理，无 DIRECT 回退。
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,REJECT,no-resolve
IP-CIDR,169.254.0.0/16,REJECT,no-resolve
GEOIP,CN,DIRECT
FINAL,🚀 强制代理

[Host]
localhost = 127.0.0.1
localhost.weixin.qq.com = 127.0.0.1

[URL Rewrite]
# google.cn 跳转到 google.com
^https?://(www\.)?g\.cn https://www.google.com 302
^https?://(www\.)?google\.cn https://www.google.com 302

[MITM]
enable = false

# ================= 手动检查项（配置文件做不到，必须手动做） =================
# 1. 关 iCloud Private Relay：设置 → Apple ID → iCloud → Private Relay → 关。
#    否则 Safari 等流量绕过小火箭直接出网，"配置正确但依然泄漏"。
# 2. 给 🧠 Claude Code 组手动选一个固定、干净的美国住宅 IP 节点，别频繁换出口。
#    IP 跳变是封号主因之一；配置只能保证"路由正确"，保证不了"IP 干净"。
# 3. 时区设为 Los Angeles、系统语言把 English 放第一位（Claude 风控看时区/语言一致性）。
# 4. 更新配置/远程规则后重启隧道；看请求日志确认：国内域名命中 DIRECT，代理域名没有直连回退。
# 5. 泄露自测：dnsleaktest.com、browserleaks.com/webrtc、ipleak.net。
#    国内域名走阿里 DNS 是预期的；代理域名绝不能出现国内/运营商 DNS。
# 6. WebRTC：到小火箭 设置 → UDP 打开「禁用 STUN」（内置的 RTC 防泄露）。
#    配置里已无规则层 RTC 防护；mDNS 本地地址混淆保持开启。
