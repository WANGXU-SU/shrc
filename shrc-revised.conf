# Shadowrocket 配置（WANGXU-SU/shrc）— 修订版（2026-10-19 重构）
#
# 设计目标（三条同时成立）：
#   1. 国外走代理，国内直连
#   2. DNS 不泄露
#   3. 国内速度不受影响
#
# 实现思路：
# · 路由：先阻断、再分流。国内域名 / 微信 / B站 / 银行走 DIRECT，
#   其余一律进代理，FINAL 强制代理，没有 DIRECT 回退。
# · DNS 与流量绑死：规则命中 DIRECT 的域名，用国内阿里 DoH 直连解析
#   （快，且 CDN 按真实位置调度）；命中代理的域名，用 1.1.1.1/8.8.8.8 的 DoH，
#   而且 DoH 连接本身走隧道（#proxy），ISP 看不到解析了什么国外域名。
#   明文 DNS（TCP 53/853）全部劫持或拒绝，没有任何一条能出网。
# · 规则从上往下、第一条命中即生效：顺序本身就是策略，越具体的越靠前。
#
# 故意保留的代价：
# · UDP 全拒绝：微信语音/视频通话、部分游戏、QUIC 全部回退 TCP（防 WebRTC 泄漏必须付的）。
# · 直连 DNS 不设代理兜底：阿里 DoH 不可用时国内域名解析直接失败——宁可失败，
#   也不让国内域名的解析串到代理出口去。
# · 私网直接拒绝：局域网网段（如家里的网关/NAS）在本机直接 REJECT，既不直连内网，也不发给远端代理。

[General]
update-url = https://raw.githubusercontent.com/WANGXU-SU/shrc/refs/heads/main/shrc-revised.conf
bypass-system = false
# 只保留本机回环直连；苹果/银行/私网不设例外，按下面的规则正常分流
skip-proxy = localhost,127.0.0.1
tun-excluded-routes = 127.0.0.0/8

# —— DNS 四路分工 ——
# 代理域名：DoH 连接本身走隧道（#proxy），ISP 看不到解析了什么国外域名
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 直连域名：国内阿里 DoH 直连——解析快，CDN 按真实位置调度；
# 用 IP 字面量，避免解析 DoH 主机本身时的启动循环
direct-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query
# 备用：主 DoH 失败时用，同样走隧道
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 仅用于代理节点自身域名的启动解析（隧道还没建立，只能直连）；
# 想彻底消除这条直连：节点改用 IP 字面量并保留 TLS SNI
proxy-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query
dns-fallback-system = false
dns-direct-system = false
# 直连域名解析失败也不回退到代理 DNS：宁可失败，不让国内域名解析串到代理出口
dns-direct-fallback-proxy = false
ipv6 = false
prefer-ipv6 = false
private-ip-answer = false
icmp-auto-reply = true
always-reject-url-rewrite = false
udp-policy-not-supported-behaviour = REJECT
# 劫持全部明文 DNS（53 端口），配合下面的 DST-PORT 拒绝：无明文 DNS 出网
hijack-dns = *:53
# 阻断全部 QUIC；因 UDP 已全局拒绝，此行是双保险
block-quic = all

[Proxy]

[Proxy Group]
# 两个组目前成员相同。🧠 组的意义是手动固定一个干净节点专供 Claude 用——
# 防封号主要靠"固定出口 IP"，配置只能保证路由正确，节点要自己选。
# 不要选"直连"，不要开全局直连模式。
🚀 强制代理 = select,PROXY,REJECT,policy-select-name=PROXY
🧠 Claude Code = select,PROXY,REJECT,policy-select-name=PROXY

[Rule]
# —— 第 1 层：隐私阻断，优先于一切分流 ——
# 覆盖任意端口的 IPv4 应用层 UDP；UDP 阻断优先于后面的 GEOIP，
# 所以中国的 UDP 同样被拒绝（故意的，代价见文件头）。
# TCP 明文 DNS / DoT / 常见 STUN/TURN 端口一并拒绝；53 端口由 hijack-dns 在本地接管。
AND,((PROTOCOL,UDP),(IP-CIDR,0.0.0.0/0)),REJECT
IP-CIDR6,::/0,REJECT,no-resolve
DST-PORT,53,REJECT
DST-PORT,853,REJECT
DST-PORT,3478,REJECT
DST-PORT,5349,REJECT
DST-PORT,19302,REJECT

# DoH 服务器自身的路由前置：主/备用 DoH 必走代理，直连 DoH 与节点启动 DoH 走直连，
# 紧跟端口阻断之后，避免每次查 DNS 遍历后面的规则集，也防止被任何上游规则截胡。
IP-CIDR,1.1.1.1/32,🚀 强制代理,no-resolve
IP-CIDR,8.8.8.8/32,🚀 强制代理,no-resolve
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
IP-CIDR,223.6.6.6/32,DIRECT,no-resolve

# 海外 AI 实时语音与主流通讯（ChatGPT/Grok/LiveKit/Discord/Signal/Telegram/Zoom/Teams/Slack）：
# 仅放轻量 DOMAIN-SUFFIX 在 stun./turn. 关键字拦截之前强制走代理（TCP 443 隧道），
# 既防止 *.turn.livekit.cloud 等语音中继被误杀，又保证 100% 走代理出口不泄密。
DOMAIN-SUFFIX,livekit.cloud,🚀 强制代理
DOMAIN-SUFFIX,chatgpt.com,🚀 强制代理
DOMAIN-SUFFIX,openai.com,🚀 强制代理
DOMAIN-SUFFIX,x.ai,🚀 强制代理
DOMAIN-SUFFIX,grok.com,🚀 强制代理
DOMAIN-SUFFIX,discord.gg,🚀 强制代理
DOMAIN-SUFFIX,discordapp.com,🚀 强制代理
DOMAIN-SUFFIX,discord.media,🚀 强制代理
DOMAIN-SUFFIX,signal.org,🚀 强制代理
DOMAIN-SUFFIX,telegram.org,🚀 强制代理
DOMAIN-SUFFIX,t.me,🚀 强制代理
DOMAIN-SUFFIX,zoom.us,🚀 强制代理
DOMAIN-SUFFIX,teams.microsoft.com,🚀 强制代理
DOMAIN-SUFFIX,skype.com,🚀 强制代理
DOMAIN-SUFFIX,slack.com,🚀 强制代理

# 其余所有未知/国内的 STUN/TURN 域名一律拒绝，防止直连探测暴露真实 IP
DOMAIN-KEYWORD,stun.,REJECT
DOMAIN-KEYWORD,turn.,REJECT

# —— 第 2 层：域名分流 ——
# Claude：官方核心主域名手写兜底 + 远程规则集（huanmeng06/proxy-config-sets）补充验证/支付/遥测域名，
# 同一出口防风控；下面手写的是工具链域名（npm/pypi/GitHub/Homebrew），稳定极少变化。
DOMAIN-SUFFIX,anthropic.com,🧠 Claude Code
DOMAIN-SUFFIX,claude.ai,🧠 Claude Code
DOMAIN-SUFFIX,claude.com,🧠 Claude Code
DOMAIN-SUFFIX,claudeusercontent.com,🧠 Claude Code
DOMAIN-SUFFIX,claudemcpcontent.com,🧠 Claude Code
RULE-SET,https://raw.githubusercontent.com/huanmeng06/proxy-config-sets/main/Rules/claude.list,🧠 Claude Code
DOMAIN-SUFFIX,npmjs.org,🧠 Claude Code
DOMAIN-SUFFIX,registry.npmjs.org,🧠 Claude Code
DOMAIN-SUFFIX,pypi.org,🧠 Claude Code
DOMAIN-SUFFIX,files.pythonhosted.org,🧠 Claude Code
DOMAIN-SUFFIX,github.com,🧠 Claude Code
DOMAIN-SUFFIX,githubusercontent.com,🧠 Claude Code
DOMAIN-SUFFIX,githubassets.com,🧠 Claude Code
DOMAIN-SUFFIX,formulae.brew.sh,🧠 Claude Code
DOMAIN-SUFFIX,storage.googleapis.com,🧠 Claude Code

# OpenAI 外围域名规则集（静态资源/CDN/API 等）：放在第 3 层，主域与语音已在第 1 层前置兜底。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,🚀 强制代理

# 微信/QQ：远程规则集直连，防异地登录风控；订阅自动更新。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/WeChat/WeChat.list,DIRECT
DOMAIN-SUFFIX,qq.com,DIRECT

# B站：远程规则集直连；视频 CDN 流量大，走代理绕路慢。订阅自动更新。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BiliBili/BiliBili.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BiliBiliIntl/BiliBiliIntl.list,DIRECT

# 银行/支付：直连。金融流量走代理会触发服务端风控（机房 IP、异地登录），
# 注意：直连只解决"出口 IP"层面；App 在本机仍能通过 utun 接口感知 VPN 开着，
# 用银行 App 如需彻底隐身，仍要临时关闭小火箭。
DOMAIN-SUFFIX,icbc.com.cn,DIRECT
DOMAIN-SUFFIX,ccb.com,DIRECT
DOMAIN-SUFFIX,ccb.com.cn,DIRECT
DOMAIN-SUFFIX,boc.cn,DIRECT
DOMAIN-SUFFIX,abchina.com,DIRECT
