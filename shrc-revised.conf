# Shadowrocket 配置（WANGXU-SU/shrc）— 修订版 2026-10-12
# GEOIP CN 直连，其余代理；Claude 优先强制代理；无 DIRECT 回退
# 严格隐私模式：拒绝应用 UDP，可能影响语音/视频通话及游戏
# YouTube 去广告需要安装并信任 MITM 证书
#
# —— 本次修订（相对原版）——
# 1. [防 Claude 直连封号] Claude 组补齐依赖域名：
#    statsig.com（claude.ai 功能开关/实验）、sentry.io（错误上报）、
#    hcaptcha.com（登录人机验证）、registry.npmjs.org（Claude Code 插件与依赖安装，
#    原只有 npmjs.org 但实际走 registry 域名）、pypi.org + files.pythonhosted.org
#    （Claude Code 的 MCP/插件经 pip 安装时用）
# 2. 其余规则经核查无硬伤，保持原样；文末附"手动检查项"（配置做不到、必须手动做的部分）
# 3. [2026-10-12 追加] Bilibili 直连：视频 CDN 流量大，走代理绕路慢；bilibili.tv
#    全球可用无需解锁，直连更快。DNS 仍走代理 DoH，不泄漏。
# 4. [2026-10-12 追加] DNS 地理修正 + 规则集订阅化，告别手写域名维护：
#    direct-dns-server 去掉 #proxy 改本地 DoH（直连域名按真实位置做 CDN 调度，
#    GEOIP 才准）；代理域名 DNS 仍走代理。手写域名列表替换为持续维护的远程
#    RULE-SET：Claude 用 huanmeng06/proxy-config-sets 的 claude.list，
#    微信/腾讯/B站/大陆域名用 blackmatrix7/ios_rule_script 的对应列表；
#    仅保留 Claude Code 工具链域名（npm/pypi/github）手写，稳定无需维护。
# 5. [2026-10-12 追加] 银行/支付直连：18 家常见银行 + 支付宝/微信支付/银联共
#    26 条 DOMAIN-SUFFIX → DIRECT，放在 China.list 之前。金融流量走代理会触发
#    服务端风控，且绝不能经过可解密中间人；MITM hostname 列表不含银行域名，
#    已确认不解密。直连只解决出口 IP 层面，App 本地仍可通过 utun 感知 VPN。

[General]
update-url = https://raw.githubusercontent.com/WANGXU-SU/shrc/refs/heads/main/shrc-revised.conf
bypass-system = false
# 不再绕过苹果、银行或私网；仅保留本机回环
skip-proxy = localhost,127.0.0.1
tun-excluded-routes = 127.0.0.0/8

# 代理流量的 DNS 经代理 DoH（隐私 + 按出口位置做 CDN 调度）；
# IP 字面量避免解析 DoH 主机时的启动循环
dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 直连流量的 DNS 在本地解析（CDN 按你的真实位置调度，GEOIP 判定才准）；
# 去掉 #proxy 是关键。直连流量目标 IP 本来就对 ISP 可见，不算泄漏。
direct-dns-server = https://223.5.5.5/dns-query,https://223.6.6.6/dns-query
fallback-dns-server = https://1.1.1.1/dns-query#proxy,https://8.8.8.8/dns-query#proxy
# 仅用于代理节点自身域名的启动解析；不能依赖尚未建立的代理
# 要消除这部分直连解析，应在节点中使用 IP 地址并保留 TLS SNI
proxy-dns-server = https://223.5.5.5/dns-query
dns-fallback-system = false
dns-direct-system = false
dns-direct-fallback-proxy = true
ipv6 = false
prefer-ipv6 = false
private-ip-answer = false
icmp-auto-reply = true
always-reject-url-rewrite = false
udp-policy-not-supported-behaviour = REJECT
hijack-dns = *:53
# 合法取值：all-proxy / all / always-allow；all = 阻断全部 QUIC（含直连）。
# 因下方已全局拒绝 UDP，QUIC（UDP/443）本就不可用，此行是双保险。
block-quic = all

[Proxy]

[Proxy Group]
# PROXY 使用首页选中的节点；不要选择“直连”，不要覆盖为全局直连模式
# 不自动轮换节点，便于 Claude 登录/API/下载保持相同出口
🚀 强制代理 = select,PROXY,REJECT,policy-select-name=PROXY
🧠 Claude Code = select,PROXY,REJECT,policy-select-name=PROXY

[Rule]
# 隐私阻断先于所有直连规则。DNS 53 查询应由 hijack-dns 在本地接管。
# PROTOCOL 置于逻辑规则内；覆盖任意端口的 IPv4 应用 UDP。
AND,((PROTOCOL,UDP),(IP-CIDR,0.0.0.0/0)),REJECT
IP-CIDR6,::/0,REJECT,no-resolve
# 补充拒绝 TCP 明文 DNS、DoT 及常见 STUN/TURN 端口
DST-PORT,53,REJECT
DST-PORT,853,REJECT
DST-PORT,3478,REJECT
DST-PORT,5349,REJECT
DOMAIN-KEYWORD,stun,REJECT
DOMAIN-KEYWORD,turn.,REJECT

# Claude：持续维护的规则集（huanmeng06/proxy-config-sets），覆盖主域/验证/支付/
# 遥测域名，走同一出口防风控；订阅自动更新，无需手写维护
RULE-SET,https://raw.githubusercontent.com/huanmeng06/proxy-config-sets/main/Rules/claude.list,🧠 Claude Code
# Claude Code 工具链域名（npm/pypi/GitHub/Homebrew），稳定极少变化，手写保留
DOMAIN-SUFFIX,npmjs.org,🧠 Claude Code
DOMAIN-SUFFIX,registry.npmjs.org,🧠 Claude Code
DOMAIN-SUFFIX,pypi.org,🧠 Claude Code
DOMAIN-SUFFIX,files.pythonhosted.org,🧠 Claude Code
DOMAIN-SUFFIX,github.com,🧠 Claude Code
DOMAIN-SUFFIX,githubusercontent.com,🧠 Claude Code
DOMAIN-SUFFIX,githubassets.com,🧠 Claude Code
DOMAIN-SUFFIX,formulae.brew.sh,🧠 Claude Code
DOMAIN-SUFFIX,storage.googleapis.com,🧠 Claude Code

# 微信/QQ：持续维护的规则集（blackmatrix7/ios_rule_script）直连，
# 防腾讯异地登录风控；订阅自动更新
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/WeChat/WeChat.list,DIRECT
DOMAIN-SUFFIX,qq.com,DIRECT

# Bilibili：持续维护的规则集直连；视频 CDN 流量大，走代理绕路慢；
# bilibili.tv 全球可用、无需解锁。订阅自动更新
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BiliBili/BiliBili.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BiliBiliIntl/BiliBiliIntl.list,DIRECT

# 银行/支付类 App 强制直连（2026-10-12 追加）：
# 金融流量走代理会触发银行服务端风控（机房 IP、异地登录），且绝不能经过
# 可解密的中间人。放在 China.list 之前，本地手写规则语义明确、优先匹配。
# 注意：直连只解决"出口 IP"层面的风控；App 在本机仍能通过 utun 隧道接口
# 感知到 VPN 开着——用银行 App 时如需彻底隐身，仍需临时关闭小火箭。
# 国有大行
DOMAIN-SUFFIX,icbc.com.cn,DIRECT
DOMAIN-SUFFIX,ccb.com,DIRECT
DOMAIN-SUFFIX,ccb.com.cn,DIRECT
DOMAIN-SUFFIX,boc.cn,DIRECT
DOMAIN-SUFFIX,abchina.com,DIRECT
DOMAIN-SUFFIX,bankcomm.com,DIRECT
DOMAIN-SUFFIX,psbc.com,DIRECT
# 股份制与城商行
DOMAIN-SUFFIX,cmbchina.com,DIRECT
DOMAIN-SUFFIX,ecitic.com,DIRECT
DOMAIN-SUFFIX,cib.com.cn,DIRECT
DOMAIN-SUFFIX,spdb.com.cn,DIRECT
DOMAIN-SUFFIX,cmbc.com.cn,DIRECT
DOMAIN-SUFFIX,cebbank.com,DIRECT
DOMAIN-SUFFIX,cgbchina.com.cn,DIRECT
DOMAIN-SUFFIX,pingan.com,DIRECT
DOMAIN-SUFFIX,pinganc.com.cn,DIRECT
DOMAIN-SUFFIX,hxb.com.cn,DIRECT
DOMAIN-SUFFIX,czbank.com,DIRECT
