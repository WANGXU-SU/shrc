# 大陆域名直连（域名版，比 GEOIP 按 IP 判定更准；配合本地 direct-dns-server，
# CDN 调度按真实位置）。订阅自动更新
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT

# 主/备用 DoH 必须代理；直连 DoH（223.5.5.5/223.6.6.6）直连；
# 节点启动 DoH 为外部直连 DNS 例外
IP-CIDR,1.1.1.1/32,🚀 强制代理,no-resolve
IP-CIDR,8.8.8.8/32,🚀 强制代理,no-resolve
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
IP-CIDR,223.6.6.6/32,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BlockHttpDNS/BlockHttpDNS.list,REJECT

# 仅回环直连
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,🚀 强制代理

[Host]
localhost = 127.0.0.1
localhost.weixin.qq.com = 127.0.0.1

[URL Rewrite]
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

# YouTube 去广告辅助重写
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200

[Script]
# YouTube Enhance / 去广告
# 脚本来源：Maasea/sgmodule
youtube.response = type=http-response,pattern=^https:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config)(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js,argument="{\"captionLang\":\"off\",\"blockUpload\":false,\"blockImmersive\":false,\"blockShorts\":false,\"debug\":false}"

youtube.request.init = type=http-request,pattern=^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js

youtube.request.log_event = type=http-request,pattern=^https:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/log_event,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js

[MITM]
# 只解密 YouTube 去广告需要的主机，避免扩大 MITM 范围
hostname = %APPEND% -redirector*.googlevideo.com,*.googlevideo.com,www.youtube.com,s.youtube.com,youtubei.googleapis.com,youtubei-att.googleapis.com,*.google.cn
enable = true

# ================= 手动检查项（配置文件做不到，必须手动做） =================
# 1. 关闭 iCloud Private Relay：设置 → Apple ID → iCloud → Private Relay → 关。
#    否则 Safari 等流量会绕过小火箭直接出去，造成"配置正确但依然泄漏"。
# 2. 时区设为 Los Angeles、系统语言把 English 放第一位。Claude 风控会看时区/语言一致性。
# 3. iOS Safari WebRTC：设置 → Safari → 高级 → Feature Flags → 关闭 WebRTC/mDNS ICE 相关项；
#    极端场景用支持禁用 WebRTC 的浏览器。配置里的 STUN 拦截是第二道防线。
# 4. Claude 用固定、干净的美国住宅 IP 节点，不要频繁切换出口 —— IP 跳变是封号主因之一，
#    配置只能保证"路由正确"，保证不了"IP 干净"。
# 5. 改完后验证：dnsleaktest.com（应只显示节点 IP 的 DNS）、browserleaks.com/webrtc、
#    ipleak.net。
# 6. 全局拒绝 UDP 后，微信语音/视频通话、部分游戏会受影响，这是严格隐私模式的代价；
#    如需恢复，把 AND,((PROTOCOL,UDP)...) 那行改为仅拦截 STUN/TURN 端口。
