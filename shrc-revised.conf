# OpenAI 外围域名规则集（静态资源/CDN/API 等）：放在第 3 层，主域与语音已在第 1 层前置兜底。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,🚀 强制代理

# 微信/QQ：远程规则集直连，防异地登录风控；订阅自动更新。
